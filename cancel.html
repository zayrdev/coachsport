<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement annulé – Mehdi Coaching</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="fitmass.css" />
  <style>
    .result-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 24px;
    }
    .result-icon {
      font-size: 4rem;
      color: #ef4444;
      margin-bottom: 24px;
    }
    .result-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      margin-bottom: 16px;
    }
    .result-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
  </style>
</head>
<body data-layout="fitmass">
  <div id="site-header"></div>
  <main class="result-page fade-in">
    <div class="result-icon">✕</div>
    <h1 class="result-title">Paiement annulé</h1>
    <p class="result-desc">Vous n'avez pas été débité. Si vous avez rencontré un problème technique, n'hésitez pas à réessayer.</p>
    <a href="panier.html" class="btn btn-brand btn-large">Retourner au panier</a>
  </main>
  <div id="site-footer"></div>
  <script src="js/site-data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/navigation.js"></script>
  <script src="cart.js"></script>
</body>
</html>
